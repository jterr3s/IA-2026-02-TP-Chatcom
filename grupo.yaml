#  avaliação. Mantenha a estrutura (nomes das chaves) exatamente como está.
#  Veja um exemplo completo em exemplos/biblioteca/grupo.yaml.
# =============================================================================

grupo:
  nome: "TODO: nome do grupo (ex.: Grupo 3)"
  integrantes:          # 3 a 4 integrantes
    - nome: "João Vitor Terres"
      rga: "202519060465"
    - nome: "TODO"
      rga: "TODO"
    - nome: "TODO"
      rga: "TODO"

tema:
  nome: "Chatcom"
  descricao: >
    Chatbot referente às grades curriculares da FACOM.

dados:                  # caminhos relativos a este arquivo - não altere
  treino: dados/treino.csv
  teste: dados/teste.csv

modelos:                # caminhos relativos a este arquivo - não altere
  escopo: modelos/escopo.joblib
  tema: modelos/tema.joblib
  # carregador: "chatbot.meu_modulo:carregar"   # opcional; ver chatbot/modelos.py

# LLM que REDIGE as respostas do bot (via OpenRouter, com a chave do grupo).
# Os classificadores decidem a ROTA; o LLM só escreve o texto da resposta.
llm:
  modelo: "openai/gpt-6-luna"   # ou o modelo indicado pelo professor
  temperatura: 0.3                       # 0 = respostas mais estáveis; 1 = mais variadas
  max_tokens: 300
  usar_em: [intencoes, chitchat]         # nós em que o LLM redige a resposta
  persona: >
    TODO: quem é o bot e como ele fala. Ex.: "Você é o Rex, assistente virtual do
    Restaurante Universitário. Seja cordial, simples e direto."
  contato: "TODO: para onde encaminhar o que o bot não sabe (setor, e-mail...)"
  max_frases: 3
  turnos_historico: 3

# Base de conhecimento (RAG). Coloque os documentos oficiais do tema em
# documentos/ (uma subpasta por intenção + geral/). O índice vetorial é criado
# automaticamente em .vectordb/ na primeira conversa com o LLM.
conhecimento:
  pasta: documentos
  representacao: tfidf        # tfidf (padrão) ou embeddings
  tamanho_trecho: 700
  k: 4
  similaridade_minima: 0.05

roteamento:
  # Abaixo desta confiança no tema, o bot pede esclarecimento em vez de responder.
  # 0 desliga o recurso. Escolha o valor com base em dados e justifique no relatório.
  limiar_tema: 0.0

# De 5 a 10 intenções. O nome (chave) deve ter só letras minúsculas sem acento,
# dígitos e "_". "descricao" aparece nas mensagens do bot ("Posso ajudar com: ...").
intencoes:   # 9 intenções; nomes sem acento, com "_"
  periodo_disciplina:
    descricao: "em que período uma disciplina aparece na grade"
    # "resposta": texto fixo, usado quando o LLM está desligado e na avaliação
    # automática. Com o LLM ligado, a resposta vem dos DOCUMENTOS (pasta documentos/).
    resposta: >
      O período de cada disciplina está na Matriz Curricular do curso, em
      ensino.ufms.br/cursos/grade/ seguido do código do curso (por exemplo,
      1904 para Ciência da Computação). O período muda de um curso para outro:
      Inteligência Artificial, por exemplo, está no 4º período de Ciência da
      Computação e no 7º de Engenharia de Computação. Informe o curso para
      uma resposta precisa.

  disciplinas_periodo:
    descricao: "quais disciplinas formam um período"
    resposta: >
      A lista de cada período está na grade do curso, com código, nome e carga
      horária. No 1º período de Ciência da Computação, por exemplo, estão
      Cálculo I, Vetores e Geometria Analítica, Algoritmos e Programação I,
      Introdução à Computação e Computação e Sociedade. Os períodos variam
      entre os cursos, então informe qual curso você quer consultar.

  obrigatorias:
    descricao: "disciplinas obrigatórias do curso, ou se uma disciplina é obrigatória"
    resposta: >
      Cada grade lista as Disciplinas Obrigatórias por período; as demais
      aparecem na lista de Disciplinas Complementares. Uma mesma disciplina
      pode ser obrigatória em um curso e complementar em outro: Fundamentos de
      Mecânica, por exemplo, é obrigatória em Engenharia de Computação e
      complementar em Ciência da Computação.

  optativas:
    descricao: "disciplinas complementares oferecidas"
    resposta: >
      As disciplinas complementares oferecidas aparecem em uma lista própria,
      logo abaixo das obrigatórias, na grade de cada curso. Na de Ciência da
      Computação, por exemplo, há Redes Neurais, Processamento de Linguagem
      Natural e Grandes Modelos de Linguagem.

  dados_disciplina:
    descricao: "código e carga horária de uma disciplina"
    resposta: >
      O código e a carga horária de cada disciplina constam na grade do curso.
      Algoritmos e Programação I, por exemplo, tem 90 horas, e Cálculo I,
      60 horas.

  prerequisitos:
    descricao: "pré-requisitos de uma disciplina"
    resposta: >
      Os pré-requisitos de cada curso ficam na página "Pré-Requisitos" do site
      de ensino da UFMS (ensino.ufms.br/cursos/prerequisito/ seguido do código
      do curso, por exemplo 1904). Consulte-a para ver o que precisa ser
      cursado antes de cada disciplina.

  disciplina_no_curso:
    descricao: "se um curso tem determinada disciplina, ou diferenças entre cursos"
    resposta: >
      É preciso olhar a grade de cada curso, porque uma disciplina pode existir
      em um e não em outro, ou ter tipo diferente. Redes Neurais, por exemplo,
      aparece como complementar em Ciência da Computação e em Engenharia de
      Computação. Informe o curso e a disciplina para uma resposta precisa.

  cursos_facom:
    descricao: "cursos de graduação oferecidos pela FACOM"
    resposta: >
      A FACOM oferece Análise e Desenvolvimento de Sistemas (1902), Ciência da
      Computação (1904), Engenharia de Computação (1905), Engenharia de
      Software (1906), Sistemas de Informação (1907) e Inteligência
      Artificial (1908). A grade de cada um está em
      ensino.ufms.br/cursos/grade/ seguido do código.

  docentes:
    descricao: "corpo docente de um curso"
    resposta: >
      O corpo docente de cada curso está na página "Corpo Docente" do site de
      ensino da UFMS (ensino.ufms.br/cursos/docentes/ seguido do código do
      curso, por exemplo 1904). Não consigo informar quem leciona cada
      disciplina em um semestre.

# Respostas dos nós que não são intenções. {assuntos} vira a lista de descrições
# das intenções; {opcao1}/{opcao2}, as duas intenções mais prováveis.
respostas:
  chitchat:
    saudacao: "Olá! Como posso ajudar?"
    agradecimento: "Por nada!"
    despedida: "Até logo!"
    padrao: "Sou um assistente automático e posso ajudar com: {assuntos}."
  fora_dominio: "Desculpe, não sei responder sobre isso. Posso ajudar com: {assuntos}."
  esclarecer: "Não tenho certeza se entendi. Sua dúvida é sobre {opcao1} ou sobre {opcao2}?"
